<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline · Splitequal</title>
<style>:root{color-scheme:light dark;--bg:#f6f8fb;--card:#fff;--fg:#1f2937;--bd:#e4e7ec;--pr:#2c72e4;--on:#fff}@media(prefers-color-scheme:dark){:root{--bg:#171717;--card:#262626;--fg:#e5e5e5;--bd:#404040;--pr:#5ba4ff;--on:#0b1220}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,Arial,sans-serif;text-align:center;padding:24px}
.c{max-width:360px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:28px}h1{margin:0 0 8px}
button{margin-top:16px;border:0;border-radius:999px;padding:10px 20px;font:600 16px Inter,system-ui,Arial,sans-serif;color:var(--on);background:var(--pr);cursor:pointer}</style></head>
<body><div class="c"><h1>You're offline</h1><p>Splitequal needs a connection to show and update your shared expenses, so nothing is stored on this device.</p><button onclick="location.reload()">Try again</button></div></body></html>
